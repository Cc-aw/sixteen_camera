# Taihang SoC RISC-V debug through Xilinx BSCANE2/JTAGTUNNEL.

adapter speed 15000
adapter driver ftdi
transport select jtag
ftdi vid_pid 0x0403 0x6010
adapter serial 210357A7D00E
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
ftdi tdo_sample_edge falling
reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 24 -ignore-version -expected-id 0x04b51093

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 riscv -chain-position $_TARGETNAME

$_TARGETNAME.0 configure -work-area-phys 0x80000000 -work-area-size 0x10000 -work-area-backup 1

riscv use_bscan_tunnel 5
riscv set_bscan_tunnel_ir 0x8e4924

init
halt
