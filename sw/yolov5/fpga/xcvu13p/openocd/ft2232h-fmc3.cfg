# FT2232H MPSSE adapter connected to XCVU13P Rocket JTAG through FMC3 LA pins.
#
# Board top/XDC mapping:
#   FT2232H ADBUS0 / SK   / SCLK -> soc_jtag_tck -> FMC3_LP17 / AV14
#   FT2232H ADBUS3 / CS          -> soc_jtag_tms -> FMC3_LP18 / AR14
#   FT2232H ADBUS1 / DO   / MOSI -> soc_jtag_tdi -> FMC3_LP28 / AP13
#   FT2232H ADBUS2 / DI   / MISO <- soc_jtag_tdo <- FMC3_LP29 / AN16
#
# The ATK-FMC EXTIO level shifter should translate FMC-side VADJ/1.8 V IO
# to the FT2232H-side 3.3 V IO.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010

# Select the external FT2232H module explicitly. This avoids accidentally
# opening the board-mounted FTDI/JTAG adapter when both are connected.
if { [info exists env(FTDI_SERIAL)] } {
  adapter serial $env(FTDI_SERIAL)
} else {
  adapter serial FTBED6DV
}

if { [info exists env(FTDI_CHANNEL)] } {
  ftdi channel $env(FTDI_CHANNEL)
} else {
  ftdi channel 0
}

# Low byte MPSSE GPIO:
#   bit0 TCK output, initial 0
#   bit1 TDI output, initial 0
#   bit2 TDO input
#   bit3 TMS output, initial 1
ftdi layout_init 0x0008 0x000b
ftdi tdo_sample_edge falling

transport select jtag
reset_config none

# Use the board-validated default. Override from scripts with:
#   -c "adapter speed <kHz>"
adapter speed 5000
