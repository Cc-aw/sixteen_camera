# RISC-V Debug Module target for LargeGemminiRocketXCVU13PConfig.
#
# The Rocket Chip JTAG DTM has a 5-bit IR. Chipyard's default JTAG IDCODE is
# usually 0x20000913, but do not force it here so the scan still works if a
# future config changes JtagDTMKey.

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -rtos hwthread

riscv set_command_timeout_sec 120

# Newer riscv-openocd revisions use set_mem_access instead of set_prefer_sba.
# Keep sysbus first so ELF loads use the Debug Module SBA path when available.
riscv set_mem_access sysbus progbuf abstract
